    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdir -p work
      - name: Run bounded validation suites
        run: ${{ matrix.commands }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.suite }}
          path: |
            work/*.json
            work/*.json.gz
            work/mayhem-burn-replay/**
          if-no-files-found: ignore
