'repro/pump/remaining-guards-main-fortyeight/main/candidate.so', '--output', 'work/pump-g1-global_init.json.gz'], 'case_count': 40}]
              CANDIDATE=Path('repro/pump/remaining-guards-main-fortyeight/main/candidate.so').resolve()
              ORIGINAL=(ROOT/'evidence/original/pump/deployed.so').resolve()
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              candidate_sha=sha(CANDIDATE);original_sha=sha(ORIGINAL)
              assert candidate_sha=='71ec4d8a646eefc82ba177afbc3d08552deadd65cf2f80ec280862eb768d059c'
              assert original_sha=='7a19affaa2c6187e04a5fe0ea298cee81fa5eb8c24cfcc30d85f615e89f7b02d'
