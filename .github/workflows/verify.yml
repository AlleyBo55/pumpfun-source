              python repro/pump_fees/fee-config-serialization-v144/verify_publication.py
              python -B scripts/verify_current_checkpoint.py pump_fees
              python -B scripts/prepare_fees_withdraw_runtime.py --output work/fees-focused-current
              python -B work/fees-focused-current/validation-layer/harness/fees_donation_business_differential.py --repo . --source-root repro/pump_fees/sharing-authorize-main-v144/source --candidate repro/pump_fees/sharing-authorize-main-v144/main/candidate.so --candidate-sha256 2387f8139a13918a5c9c523f140ecdd72db7243c8e2ed9cd7e1ff9d42ad6c8af --build-record repro/pump_fees/sharing-authorize-main-v144/main/build-comparison.json --output work/fees-donation-focused20.json
