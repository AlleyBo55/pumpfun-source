name: Verify captured evidence
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - suite: evidence
            commands: |
              python scripts/verify_evidence.py
              python scripts/test_tooling.py
              python scripts/test_build_source_manifest.py
              python scripts/test_core_linux_v144_retention.py
              python repro/pump_fees/initializer-inline-runtime/verify.py
              python scripts/verify_recovered_builds.py
              python -B repro/consolidation/2026-10-26/guard.py verify_current.py --repo . --metadata repro/layered-passes/pass-27/current-metadata
              python -B repro/consolidation/2026-10-26/guard.py verify_metadata.py --repo . --metadata repro/layered-passes/pass-27/current-metadata
              python -B repro/consolidation/2026-10-26/guard.py verify_portable_crypto.py --repo . --metadata repro/layered-passes/pass-27/current-metadata --python312 python
              python -B repro/layered-passes/pass-19/ci-followup/verify.py --repo .
              python -B repro/pump/wide-runtime-attribution/verify.py --repo .
              python scripts/pump_verify_dependencies.py
              python repro/pump/metaplex-candidate-build-11/verify.py
              python -B repro/identity-audit/2026-10-25/verify.py
              python -B repro/pump/metaplex-utilize-guard-source-recovery/verify.py
              python -B repro/pump/metaplex-candidate-build-12-review/verify.py
              python -B repro/pump/metaplex-candidate-build-13-review/verify.py
              python -B repro/pump/metaplex-candidate-build-14-review/verify.py
              python -B repro/pump/metaplex-authentic-source-history/verify.py
              # Stopped BuyV3 research packets remain passive evidence in this reconciliation.
              python -B repro/pump/metaplex-utilize-positive-guard-source-recovery/verify.py
              python -B repro/pump/metaplex-utilize-unified-guard-source-recovery/verify.py
              python -B repro/sdk/interface-audit-20261025/verify.py
              python -B repro/build-tooling/supported-sbpf-proposal/verify.py
              python -B repro/build-tooling/supported-sbpf-integration/verify.py
              python -B scripts/test_supported_sbpf_policy.py
              python scripts/test_reconstruction_build_selection.py
              python scripts/test_reconstruction_identity_audit.py
              python scripts/test_localnet_sdk_plan.py
              python repro/pump/mayhem-virtual-params-static/verify.py
              python scripts/local_validation.py
              git diff --exit-code -- audit/local-validation.json
          - suite: host-fragments
            commands: |
              mkdir -p work && rustc --edition 2021 -O programs/pump-fees/recovered/fee_selection_host.rs -o work/fee-selector-host
              python scripts/validate_fee_selection.py --host work/fee-selector-host --output work/fee-selector-validation.json
              python scripts/build_quote_host.py --output work/quote-host
              python scripts/validate_quote_fees.py --host work/quote-host/quote-fees-host --output work/quote-validation.json
              rustc --edition=2021 -O programs/pump/recovered/constant_product_host.rs -o work/pump-math-host
              python scripts/pump_validate_constant_product.py --host work/pump-math-host --output work/pump-math.json
              rustc --edition=2021 -O programs/pump/recovered/sell_accounting_host.rs -o work/pump-sell-accounting-host
              python scripts/pump_validate_sell_accounting.py --host work/pump-sell-accounting-host --output work/pump-sell-accounting.json
